<!doctype html>
<html lang="en">
<head>
  <!-- Required first -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Icons / PWA -->
  <link rel="icon" href="/favicon.ico" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0B1220" />

  <!-- Indexing -->
  <meta name="robots" content="index,follow" />
  <link rel="canonical" href="https://www.bioprecision.org" />

  <!-- Title + Description -->
  <title>BioPrecision - Precision Health Platform</title>
  <meta name="author" content="BioPrecision" />
  <meta name="description" content="Transform biodata into exact actions with AI-powered precision health guidance." />

  <!-- Open Graph -->
  <meta property="og:site_name" content="BioPrecision" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:title" content="BioPrecision – Precision Health Platform" />
  <meta property="og:description" content="AI-driven personalized insights for metabolic health, longevity, and performance." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.bioprecision.org" />
  <meta property="og:image" content="https://www.bioprecision.org/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="BioPrecision: your body, decoded" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@BioPrecision" />
  <meta name="twitter:creator" content="@BioPrecision" />
  <meta name="twitter:title" content="BioPrecision – Precision Health Platform" />
  <meta name="twitter:description" content="AI-driven personalized health optimization." />
  <meta name="twitter:image" content="https://www.bioprecision.org/og-image.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="preload" as="font" href="/fonts/inter-var.woff2" type="font/woff2" crossorigin>

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "BioPrecision",
    "applicationCategory": "HealthApplication",
    "operatingSystem": "Web",
    "url": "https://www.bioprecision.org",
    "description": "AI-powered precision health guidance from your biodata.",
    "publisher": { "@type": "Organization", "name": "BioPrecision" }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
